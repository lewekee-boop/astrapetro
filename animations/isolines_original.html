<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Original Isolines Animation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=Oswald:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --font-sans: "IBM Plex Sans", "Segoe UI", sans-serif;
      --font-display: "Oswald", "Segoe UI", sans-serif;
      --text-sm: 0.875rem;
      --weight-500: 500;
      --lh-tight: 1.15;
      --ls-caps: 0.08em;
      --space-2: 8px;
      --space-4: 16px;
      --surface-bg: rgba(255, 255, 255, 0.84);
      --gray-600: #2b3340;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: linear-gradient(180deg, #f9fbff 0%, #eef3fa 50%, #e7eef8 100%);
      font-family: var(--font-sans);
    }

    .hud-panel {
      width: min(920px, 100%);
      background: var(--surface-bg);
      border-radius: 18px;
      padding: 22px;
      border: 1px solid rgba(31, 95, 191, 0.25);
      box-shadow: 0 18px 40px rgba(18, 32, 56, 0.12);
      position: relative;
      overflow: hidden;
    }

    .hud-panel::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at top left, rgba(123, 188, 241, 0.2), transparent 60%);
      opacity: 0.6;
    }

    .cad-anim {
      position: relative;
      height: clamp(280px, 48vw, 440px);
      margin-bottom: var(--space-4);
    }

    .cad-svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .cad-svg path {
      fill: none;
    }

    svg text {
      font-family: var(--font-sans);
      font-size: var(--text-sm);
      font-weight: var(--weight-500);
      line-height: var(--lh-tight);
    }

    .cad-anim::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 10px;
      background: var(--surface-bg);
      z-index: 0;
    }

    .cad-svg,
    .cad-title {
      position: relative;
      z-index: 1;
    }

    .cad-grid path {
      stroke: rgba(31, 95, 191, 0.18);
      stroke-width: 1;
      fill: none;
      opacity: 0;
      animation: cad-grid 0.6s ease forwards;
    }

    .cad-axes path {
      stroke: rgba(31, 95, 191, 0.35);
      stroke-width: 1.2;
      fill: none;
      opacity: 0;
      animation: cad-grid 0.6s ease forwards;
    }

    .cad-contour path {
      stroke: rgba(31, 95, 191, 0.45);
      stroke-width: 1.4;
      fill: none;
      stroke-dasharray: 900;
      stroke-dashoffset: 900;
      animation: cad-draw 1s ease forwards;
      animation-delay: 0.6s;
    }

    .cad-contour .cad-oval {
      stroke-dasharray: 1400;
      stroke-dashoffset: 1400;
    }

    .cad-contour .cad-inner {
      stroke-width: 1;
      animation-delay: 0.85s;
    }

    .cad-detail {
      opacity: 0;
      transform: translateY(6px);
      animation: cad-detail 0.8s ease forwards;
      animation-delay: 1.6s;
    }

    .cad-detail path {
      stroke: rgba(31, 95, 191, 0.35);
      stroke-width: 1;
      fill: none;
    }

    .cad-detail text {
      font-family: var(--font-sans);
      font-size: var(--text-sm);
      font-weight: var(--weight-500);
      line-height: var(--lh-tight);
      fill: rgba(90, 103, 122, 0.9);
    }

    .cad-title {
      position: absolute;
      left: 50%;
      bottom: var(--space-4);
      transform: translateX(-50%);
      font-family: var(--font-display);
      font-size: var(--text-sm);
      text-transform: uppercase;
      letter-spacing: var(--ls-caps);
      line-height: var(--lh-tight);
      font-weight: var(--weight-500);
      color: var(--gray-600);
      text-align: center;
      opacity: 0;
      filter: blur(6px);
      animation: cad-title 0.6s ease forwards;
      animation-delay: 2.4s;
    }

    .cad-title-line {
      position: relative;
      display: inline-block;
      padding-bottom: var(--space-2);
    }

    .cad-title-line::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 58%;
      height: 2px;
      transform: translateX(-50%);
      background: rgba(31, 95, 191, 0.45);
    }

    @keyframes cad-grid {
      to { opacity: 1; }
    }

    @keyframes cad-draw {
      to { stroke-dashoffset: 0; }
    }

    @keyframes cad-detail {
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes cad-title {
      to { opacity: 1; filter: blur(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .cad-grid path,
      .cad-axes path,
      .cad-contour path,
      .cad-detail,
      .cad-title {
        animation: none;
        opacity: 1;
        transform: none;
        filter: none;
        stroke-dashoffset: 0;
      }

      .cad-title {
        transform: translateX(-50%);
      }
    }
  </style>
</head>
<body>
  <div class="hud-panel">
    <div class="cad-anim" aria-hidden="true">
      <svg class="cad-svg" viewBox="0 0 520 280" preserveAspectRatio="xMidYMid meet" role="presentation" focusable="false">
        <g class="cad-scene" transform="translate(260 140) rotate(90) scale(1.6) translate(-260 -140)">
          <g class="cad-grid">
            <path d="M40 50H480M40 90H480M40 130H480M40 170H480M40 210H480" />
            <path d="M80 30V250M140 30V250M200 30V250M260 30V250M320 30V250M380 30V250M440 30V250" />
          </g>
          <g class="cad-contour">
            <path class="cad-oval" d="M72 166C76 122 116 90 184 74C253 58 332 64 390 92C446 119 459 166 430 203C399 243 333 264 255 260C178 256 111 233 84 201C74 188 70 177 72 166Z" />
            <path class="cad-inner" d="M110 165C116 134 147 110 197 96C248 83 305 86 347 105C388 124 398 157 376 184C354 212 306 228 250 229C195 229 145 214 121 191C112 183 108 174 110 165Z" />
            <path class="cad-inner" d="M148 163C153 143 175 127 211 116C248 105 288 106 317 120C346 134 353 154 338 173C321 194 287 206 246 208C205 210 171 200 155 186C149 180 146 172 148 163Z" />
            <path class="cad-inner" d="M184 160C188 149 201 139 222 132C244 125 268 124 286 131C304 138 309 148 300 160C290 174 270 183 246 185C222 187 202 181 192 173C186 168 183 164 184 160Z" />
          </g>
          <g class="cad-detail">
            <circle cx="134" cy="137" r="4" />
            <circle cx="226" cy="112" r="4" />
            <circle cx="326" cy="133" r="4" />
            <text x="148" y="130" text-anchor="middle" transform="rotate(-90 148 130)">Скв. A-12</text>
            <text x="240" y="104" text-anchor="middle" transform="rotate(-90 240 104)">Скв. B-07</text>
            <text x="340" y="126" text-anchor="middle" transform="rotate(-90 340 126)">Скв. C-04</text>
          </g>
        </g>
      </svg>
      <div class="cad-title">
        <span class="cad-title-line">Проектирование разработки месторождений</span>
      </div>
    </div>
  </div>
</body>
</html>
