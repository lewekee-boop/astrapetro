<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Geo Section Animation Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=Oswald:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="geo_section.css" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: linear-gradient(180deg, #f9fbff 0%, #eef3fa 50%, #e7eef8 100%);
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
    }

    .demo-shell {
      width: min(920px, 100%);
      background: rgba(255, 255, 255, 0.84);
      border-radius: 18px;
      border: 1px solid rgba(31, 95, 191, 0.25);
      box-shadow: 0 18px 40px rgba(18, 32, 56, 0.12);
      padding: 22px;
      position: relative;
      overflow: hidden;
    }

    .demo-shell::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at top left, rgba(123, 188, 241, 0.2), transparent 60%);
      opacity: 0.6;
    }

    .geo-anim::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.84);
      z-index: 0;
    }

    .geo-section-svg,
    .geo-caption {
      position: relative;
      z-index: 1;
    }
  </style>
</head>
<body>
  <div class="demo-shell">
    <div class="geo-anim" aria-hidden="true">
      <svg class="geo-section-svg" data-geo-section-svg viewBox="0 0 520 280" preserveAspectRatio="xMidYMid meet" role="presentation" focusable="false">
        <defs>
          <path id="reservoir-lens-shape" d="M178 176C201 166 230 160 260 160C291 160 319 166 343 176C319 184 291 189 260 189C229 189 201 184 178 176Z" />
          <clipPath id="reservoir-lens-clip">
            <use href="#reservoir-lens-shape" />
          </clipPath>
          <mask id="oil-reveal-mask">
            <rect x="0" y="0" width="520" height="280" fill="black" />
            <rect id="oil-reveal-rect" x="178" y="158" width="165" height="34" rx="11" ry="11" fill="white" />
          </mask>
        </defs>

        <g id="grid">
          <path d="M40 46H480M40 82H480M40 118H480M40 154H480M40 190H480M40 226H480" />
          <path d="M84 30V250M140 30V250M196 30V250M252 30V250M308 30V250M364 30V250M420 30V250" />
        </g>

        <g id="axes">
          <path d="M40 30V250M40 250H480" />
        </g>

        <g id="strata">
          <path class="strata-line soft" d="M34 52C96 42 156 45 220 58C286 71 354 79 486 66" />
          <path class="strata-line" d="M34 76C106 64 172 68 238 82C306 96 373 104 486 90" />
          <path class="strata-line soft" d="M34 100C104 90 168 93 232 108C300 123 367 132 486 118" />
          <path class="strata-line" d="M34 124C100 114 162 118 224 132C292 147 360 156 486 142" />
          <path class="strata-line reservoir-layer" d="M34 148C102 138 165 142 226 156C292 171 358 179 486 166" />
          <path class="strata-line soft" d="M34 176C104 166 168 170 232 184C300 199 367 207 486 194" />
          <path class="strata-line" d="M34 204C106 194 172 198 238 212C306 226 373 234 486 222" />
        </g>

        <g id="well">
          <path id="well-path" class="well-path" d="M260 4V176" />
          <circle class="well-bit-halo" cx="260" cy="176" r="10" />
          <circle class="well-bit" cx="260" cy="176" r="4.5" />
        </g>

        <g id="trap">
          <use class="trap-outline" href="#reservoir-lens-shape" />
          <use class="trap-lens" href="#reservoir-lens-shape" />
        </g>

        <g id="oil">
          <path id="oil-route" d="M338 176C315 172 292 172 274 174C268 175 264 176 260 176" />
          <path class="oil-mass" clip-path="url(#reservoir-lens-clip)" mask="url(#oil-reveal-mask)" d="M178 176C202 166 230 160 260 160C291 160 320 166 343 176L343 189L178 189Z" />
          <path class="oil-wave" clip-path="url(#reservoir-lens-clip)" mask="url(#oil-reveal-mask)" d="M188 178C208 171 233 169 260 170C288 171 313 175 332 180L332 186C313 182 287 179 260 178C233 177 208 179 188 183Z" />
          <circle class="oil-packet" r="3.3" cx="338" cy="176" />
          <circle class="oil-packet" r="2.9" cx="338" cy="176" />
          <circle class="oil-packet" r="2.6" cx="338" cy="176" />
        </g>

        <g id="flow">
          <path class="flow-path" d="M260 176V4" />
        </g>
      </svg>

      <div class="geo-caption">
        <span>Проектирование разработки месторождений</span>
      </div>
    </div>
  </div>

  <script src="geo_section.js"></script>
</body>
</html>
