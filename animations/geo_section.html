<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Geo Section Animation Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=Oswald:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="geo_section.css" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: linear-gradient(180deg, #f9fbff 0%, #eef3fa 50%, #e7eef8 100%);
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
    }

    .demo-shell {
      width: min(920px, 100%);
      background: rgba(255, 255, 255, 0.84);
      border-radius: 18px;
      border: 1px solid rgba(31, 95, 191, 0.25);
      box-shadow: 0 18px 40px rgba(18, 32, 56, 0.12);
      padding: 22px;
      position: relative;
      overflow: hidden;
    }

    .demo-shell::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at top left, rgba(123, 188, 241, 0.2), transparent 60%);
      opacity: 0.6;
    }

    .geo-anim::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.84);
      z-index: 0;
    }

    .geo-section-svg,
    .geo-caption {
      position: relative;
      z-index: 1;
    }
  </style>
</head>
<body>
  <div class="demo-shell">
    <div class="geo-anim" aria-hidden="true">
      <svg class="geo-section-svg" data-geo-section-svg viewBox="0 0 520 280" preserveAspectRatio="xMidYMid meet" role="presentation" focusable="false">
        <defs>
          <path id="reservoir-lens-shape" d="M222 169C246 159 276 154 309 155C341 156 371 163 396 174C371 181 343 185 311 186C278 186 247 181 222 169Z" />
          <clipPath id="reservoir-lens-clip">
            <use href="#reservoir-lens-shape" />
          </clipPath>
          <mask id="oil-reveal-mask">
            <rect x="0" y="0" width="520" height="280" fill="black" />
            <rect id="oil-reveal-rect" x="220" y="152" width="180" height="38" rx="12" ry="12" fill="white" />
          </mask>
        </defs>

        <g id="grid">
          <path d="M40 46H480M40 82H480M40 118H480M40 154H480M40 190H480M40 226H480" />
          <path d="M84 30V250M140 30V250M196 30V250M252 30V250M308 30V250M364 30V250M420 30V250" />
        </g>

        <g id="axes">
          <path d="M40 30V250M40 250H480" />
        </g>

        <g id="strata">
          <path class="strata-line" d="M34 70C96 56 156 58 220 72C286 86 354 95 486 80" />
          <path class="strata-line soft" d="M34 100C108 86 176 89 246 106C316 123 379 132 486 116" />
          <path class="strata-line" d="M34 132C102 122 165 126 226 141C293 156 360 166 486 152" />
          <path class="strata-line reservoir-layer" d="M34 164C98 156 156 161 218 176C286 192 353 201 486 186" />
          <path class="reservoir-band" d="M214 171C242 160 275 155 311 156C347 157 376 164 403 176" />
          <path class="strata-line" d="M34 196C110 188 176 195 246 210C319 226 385 236 486 222" />
        </g>

        <g id="well">
          <path id="well-path" class="well-path" d="M128 18L128 168Q128 176 136 176L286 176Q298 176 298 168" />
          <circle class="well-bit-halo" cx="298" cy="168" r="10" />
          <circle class="well-bit" cx="298" cy="168" r="4.5" />
        </g>

        <g id="trap">
          <use class="trap-outline" href="#reservoir-lens-shape" />
          <use class="trap-lens" href="#reservoir-lens-shape" />
        </g>

        <g id="oil">
          <path id="oil-route" d="M386 173C355 166 331 164 314 165C306 166 301 167 298 168" />
          <path class="oil-mass" clip-path="url(#reservoir-lens-clip)" mask="url(#oil-reveal-mask)" d="M222 170C247 160 276 155 311 156C347 157 377 165 402 176L402 188L222 188Z" />
          <path class="oil-wave" clip-path="url(#reservoir-lens-clip)" mask="url(#oil-reveal-mask)" d="M232 173C252 166 278 164 307 165C337 167 365 172 391 178L391 184C364 179 336 176 306 175C277 174 252 177 232 181Z" />
          <circle class="oil-packet" r="3.3" cx="386" cy="173" />
          <circle class="oil-packet" r="2.9" cx="386" cy="173" />
          <circle class="oil-packet" r="2.6" cx="386" cy="173" />
        </g>

        <g id="flow">
          <path class="flow-path" d="M298 168Q298 176 286 176L136 176Q128 176 128 168L128 18" />
        </g>
      </svg>

      <div class="geo-caption">
        <span>Проектирование разработки месторождений</span>
      </div>
    </div>
  </div>

  <script src="geo_section.js"></script>
</body>
</html>
