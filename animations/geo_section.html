<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Geo Section Animation Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=Oswald:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="geo_section.css" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: linear-gradient(180deg, #f9fbff 0%, #eef3fa 50%, #e7eef8 100%);
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
    }

    .demo-shell {
      width: min(920px, 100%);
      background: rgba(255, 255, 255, 0.84);
      border-radius: 18px;
      border: 1px solid rgba(31, 95, 191, 0.25);
      box-shadow: 0 18px 40px rgba(18, 32, 56, 0.12);
      padding: 22px;
      position: relative;
      overflow: hidden;
    }

    .demo-shell::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at top left, rgba(123, 188, 241, 0.2), transparent 60%);
      opacity: 0.6;
    }

    .geo-anim::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.84);
      z-index: 0;
    }

    .geo-section-svg,
    .geo-caption {
      position: relative;
      z-index: 1;
    }
  </style>
</head>
<body>
  <div class="demo-shell">
    <div class="geo-anim" aria-hidden="true">
      <svg class="geo-section-svg" data-geo-section-svg viewBox="0 0 520 280" preserveAspectRatio="xMidYMid meet" role="presentation" focusable="false">
        <defs>
          <pattern id="trap-cell" width="14" height="14" patternUnits="userSpaceOnUse">
            <rect width="14" height="14" fill="var(--geo-trap-fill)" />
            <path d="M0 0H14M0 7H14M0 14H14M0 0V14M7 0V14M14 0V14" fill="none" stroke="var(--geo-trap-cell)" stroke-width="0.6" />
          </pattern>
          <path id="trap-shape" d="M236 190C244 166 272 148 310 146C347 144 388 154 420 170C438 179 447 194 446 212C445 225 431 234 411 236L262 236C247 233 238 223 236 210Z" />
          <clipPath id="trap-clip">
            <use href="#trap-shape" />
          </clipPath>
          <mask id="oil-reveal-mask">
            <rect x="0" y="0" width="520" height="280" fill="black" />
            <rect id="oil-reveal-rect" x="236" y="140" width="220" height="96" rx="22" ry="22" fill="white" />
          </mask>
        </defs>

        <g id="grid">
          <path d="M40 46H480M40 82H480M40 118H480M40 154H480M40 190H480M40 226H480" />
          <path d="M84 30V250M140 30V250M196 30V250M252 30V250M308 30V250M364 30V250M420 30V250" />
        </g>

        <g id="axes">
          <path d="M40 30V250M40 250H480" />
        </g>

        <g id="strata">
          <path class="strata-line" d="M34 70C96 56 156 58 220 72C286 86 354 95 486 80" />
          <path class="strata-line soft" d="M34 100C108 86 176 89 246 106C316 123 379 132 486 116" />
          <path class="strata-line" d="M34 132C102 122 165 126 226 141C293 156 360 166 486 152" />
          <path class="strata-line soft" d="M34 164C98 156 156 161 218 176C286 192 353 201 486 186" />
          <path class="strata-line" d="M34 196C110 188 176 195 246 210C319 226 385 236 486 222" />
        </g>

        <g id="well">
          <path id="well-path" class="well-path" d="M128 18L128 212Q128 220 136 220L294 220Q306 220 306 208L306 196" />
          <circle class="well-bit-halo" cx="306" cy="196" r="10" />
          <circle class="well-bit" cx="306" cy="196" r="4.5" />
        </g>

        <g id="trap">
          <use class="trap-outline" href="#trap-shape" />
          <rect class="trap-body" x="236" y="140" width="220" height="96" clip-path="url(#trap-clip)" />
          <path class="trap-cap" d="M252 168C274 156 300 152 328 154C356 156 382 164 410 178" />
        </g>

        <g id="oil">
          <path id="oil-route" d="M420 190C380 188 347 190 322 194C314 196 309 196 306 196" />
          <path class="oil-mass" clip-path="url(#trap-clip)" mask="url(#oil-reveal-mask)" d="M242 206C260 194 289 190 320 192C354 194 384 204 412 212C424 215 434 218 442 222L442 236L242 236Z" />
          <path class="oil-wave" clip-path="url(#trap-clip)" mask="url(#oil-reveal-mask)" d="M250 207C275 196 299 195 324 198C351 201 378 208 412 216L412 226C381 218 353 214 324 212C296 210 272 213 250 222Z" />
          <circle class="oil-packet" r="3.3" cx="420" cy="190" />
          <circle class="oil-packet" r="2.9" cx="420" cy="190" />
          <circle class="oil-packet" r="2.6" cx="420" cy="190" />
        </g>

        <g id="flow">
          <path class="flow-path" d="M306 196L306 208Q306 220 294 220L136 220Q128 220 128 212L128 18" />
        </g>
      </svg>

      <div class="geo-caption">
        <span>Проектирование разработки месторождений</span>
      </div>
    </div>
  </div>

  <script src="geo_section.js"></script>
</body>
</html>
